schema: spec-driven

context: |
  Segui AGENTS.md e avvia la selezione del contesto da Docs/ai/documentation_context_router.md.
  OpenSpec governa i requisiti osservabili delle capability; Docs/ai governa architettura, invarianti e operazioni.
  Lo stack comprende React, TypeScript, Vite, Fastify, SSE, SQLite e snapshot JSON locali secondo la documentazione corrente.
  Scrivi gli artefatti in italiano, preservando identificatori tecnici e parole normative SHALL/MUST.

rules:
  specs:
    - Copri autorizzazione, errori, compatibilita, concorrenza e migrazione quando applicabili.
  tasks:
    - Collega ogni requisito modificato a test automatici o a una verifica manuale esplicitamente giustificata.
    - Includi la valutazione dell'impatto su Docs/ai e npm run docs:check quando cambia la documentazione.

operations:
  apply:
    guidance:
      - Segui tutti i router Docs/ai applicabili ed esegui i controlli richiesti da AGENTS.md prima di completare un task.
  archive:
    guidance:
      - Archivia solo dopo la verifica tra implementazione e specifiche e dopo il superamento dei controlli di progetto.
